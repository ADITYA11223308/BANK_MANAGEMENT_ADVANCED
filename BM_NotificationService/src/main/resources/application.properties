spring.application.name=BM_NotificationService

server.port=8083

spring.kafka.bootstrap-servers=localhost:19092

spring.datasource.url=jdbc:mysql://localhost:3306/bank_notification_db
spring.datasource.username=root
spring.datasource.password=Aditya@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=BM_NotificationService.event.TransactionCompletedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

nginx.url=http://localhost:8090
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
