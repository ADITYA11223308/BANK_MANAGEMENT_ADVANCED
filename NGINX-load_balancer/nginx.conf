
events {
}

http {

     log_format upstream_log
        '$remote_addr - $request '
        'status=$status '
        'upstream=$upstream_addr';
        access_log /var/log/nginx/access.log upstream_log;

    upstream user_service {
        server host.docker.internal:8080;
    }

    upstream account_service {
        server host.docker.internal:8081;
        server host.docker.internal:8085;
    }

    upstream transaction_service {
        server host.docker.internal:8082;
    }

    upstream notification_service {
        server host.docker.internal:8083;
    }

    upstream auth_service {
        server host.docker.internal:8084;
    }

    server {

        listen 8080;

        # User Service
        location /users {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://user_service;
        }

        # Account Service
        location /accounts/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://account_service;
        }

        # Transaction Service
        location /transactions/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://transaction_service;
        }

        # Auth Service
        location /auth/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://auth_service;
        }

        # Notification Service
        location /notifications/ {
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
              
            proxy_pass http://notification_service;
        }
    }
}