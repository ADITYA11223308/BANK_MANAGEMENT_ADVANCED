<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer &mdash; BM Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='transfer')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/topbar :: topbar(user=${user})}"></div>

        <div class="page-body" style="max-width:560px;">
            <div class="page-header">
                <h2>Transfer Money</h2>
                <p>Send funds to another BM Bank account.</p>
            </div>

            <div th:if="${account == null}" class="panel empty-state">
                <div class="icon">&#128179;</div>
                <h4>No account yet</h4>
                <p>You need an account before you can transfer funds.</p>
                <a href="/account/create" class="btn btn-primary">Create Account</a>
            </div>

            <div th:if="${account != null}">
                <div class="panel">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="label">From Account</div>
                            <div class="value" th:text="${account.accountNumber}">00000000</div>
                        </div>
                        <div class="info-item">
                            <div class="label">Current Balance</div>
                            <div class="value" th:text="'&#8377;' + ${#numbers.formatDecimal(account.balance, 0, 'COMMA', 2, 'POINT')}">&#8377;0.00</div>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="alert alert-success" th:if="${success}"><span th:text="${success}"></span></div>
                    <div class="alert alert-error" th:if="${error}"><span th:text="${error}"></span></div>

                    <form th:action="@{/transfer}" method="post">
                        <input type="hidden" name="idempotencyKey" th:value="${idempotencyKey}">
                        <div class="form-group">
                            <label for="receiverAccountNumber">Receiver Account Number</label>
                            <input type="number" id="receiverAccountNumber" name="receiverAccountNumber" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount (&#8377;)</label>
                            <input type="number" id="amount" name="amount" min="0.01" step="0.01" required>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Transfer</button>
                    </form>

                    <div class="reassurance">
                        <span>&#128274;</span>
                        <span>Transfers are processed atomically &mdash; if the receiving deposit fails, your balance is automatically restored.</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
