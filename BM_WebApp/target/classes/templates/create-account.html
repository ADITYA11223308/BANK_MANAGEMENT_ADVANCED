<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open an Account &mdash; BM Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar(active='account')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/topbar :: topbar(user=${user})}"></div>

        <div class="page-body" style="max-width:560px;">
            <div class="page-header">
                <h2>Open a Bank Account</h2>
                <p>Choose your account type to get started.</p>
            </div>

            <div class="panel">
                <div class="alert alert-error" th:if="${error}">
                    <span th:text="${error}"></span>
                </div>

                <form th:action="@{/account/create}" method="post">
                    <div class="form-group">
                        <label for="accountType">Account Type</label>
                        <select id="accountType" name="accountType" required>
                            <option th:each="type : ${accountTypes}" th:value="${type}" th:text="${type}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="initialBalance">Initial Deposit (&#8377;)</label>
                        <input type="number" id="initialBalance" name="initialBalance" min="0" step="0.01" value="0" required>
                        <div class="field-hint">This becomes your account's opening balance.</div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
