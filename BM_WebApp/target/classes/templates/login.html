<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &mdash; BM Bank</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="brand"><span class="brand-mark">BM</span><span>BM Bank</span></div>
        <p class="auth-subtitle">Log in to access your account</p>

        <div class="alert alert-success" th:if="${success}">
            <span th:text="${success}"></span>
        </div>
        <div class="alert alert-error" th:if="${error}">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" th:value="${email}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register">Open one now</a>
        </div>
    </div>
</div>

</body>
</html>
